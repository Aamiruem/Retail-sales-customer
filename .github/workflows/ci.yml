name: Retail Analytics CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Rebuild analytics outputs
        run: python -m src.run_pipeline
      - name: Run automated tests (incl. dashboard page smoke tests)
        run: python -m pytest -q tests
      - name: Verify project contract
        run: python scripts/verify_project.py

